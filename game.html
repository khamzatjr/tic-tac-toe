<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра — X & O</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">X & O</a>
    <ul>
      <li><a href="index.html">Главная</a></li>
      <li><a href="mode.html">Играть</a></li>
      <li><a href="records.html">Рекорды</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    <div class="game-container">

      <!-- Статус игры -->
      <div class="game-status">
        <div class="player-info" id="info-p1">
          <span class="player-symbol x-mark">✕</span>
          <span class="player-name" id="name-p1">Игрок 1</span>
          <span class="player-score" id="score-p1">0</span>
        </div>

        <div class="turn-indicator">
          <p class="turn-text" id="turn-text">Ход игрока</p>
          <p class="turn-name" id="turn-name">—</p>
        </div>

        <div class="player-info" id="info-p2">
          <span class="player-score" id="score-p2">0</span>
          <span class="player-name" id="name-p2">Игрок 2</span>
          <span class="player-symbol o-mark">◯</span>
        </div>
      </div>

      <!-- Игровое поле -->
      <div class="board-wrapper">
        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <!-- Победная линия SVG -->
        <svg class="win-line" id="win-line" viewBox="0 0 300 300">
          <line id="win-line-el" x1="0" y1="0" x2="0" y2="0"/>
        </svg>
      </div>

      <!-- Оверлей результата -->
      <div class="result-overlay" id="result-overlay">
        <div class="result-card">
          <p class="result-emoji" id="result-emoji">🏆</p>
          <p class="result-text" id="result-text">Победитель!</p>
          <p class="result-name" id="result-name">Имя</p>
          <div class="result-buttons">
            <button class="btn btn-primary" onclick="restartGame()">Ещё раз</button>
            <a href="mode.html" class="btn">В меню</a>
          </div>
        </div>
      </div>

      <!-- Кнопки управления -->
      <div class="game-controls">
        <button class="btn" onclick="restartGame()">Заново</button>
        <a href="mode.html" class="btn">← Меню</a>
        <a href="records.html" class="btn">Рекорды</a>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
