<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рекорды — X & O</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/records.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">X & O</a>
    <ul>
      <li><a href="index.html">Главная</a></li>
      <li><a href="mode.html">Играть</a></li>
      <li><a href="records.html">Рекорды</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    <div class="records-container">

      <div class="records-header">
        <h1 class="records-title">Рекорды</h1>
        <button class="btn" id="clear-btn" onclick="clearRecords()">
          Очистить
        </button>
      </div>

      <div class="stats-block" id="stats-block">
        <div class="stat-card">
          <span class="stat-number" id="stat-total">0</span>
          <span class="stat-label">Всего игр</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="stat-wins">0</span>
          <span class="stat-label">Побед X</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="stat-losses">0</span>
          <span class="stat-label">Побед O</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="stat-draws">0</span>
          <span class="stat-label">Ничьих</span>
        </div>
      </div>

      <div class="records-list" id="records-list">

        <div class="records-empty" id="records-empty">
          <p class="empty-icon">📋</p>
          <p class="empty-text">Пока нет сыгранных партий</p>
          <a href="mode.html" class="btn btn-primary">Сыграть первую</a>
        </div>

        <table class="records-table" id="records-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Игрок X</th>
              <th>Игрок O</th>
              <th>Победитель</th>
              <th>Режим</th>
            </tr>
          </thead>
          <tbody id="records-tbody">
          </tbody>
        </table>

      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/records.js"></script>
</body>
</html>
